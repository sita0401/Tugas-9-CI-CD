name: CI/CD - Deploy ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ===== CI: Build =====
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Build website (siapkan folder dist)
        run: |
          mkdir dist
          cp index.html dist/
          cat > dist/build-info.json <<EOF
          {
            "commit": "${GITHUB_SHA::7}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "built_at": "$(date -u +'%Y-%m-%d %H:%M UTC')"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ===== CD: Deploy =====
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
